name: Run MC Bot
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Installime süsteemi teegid 3D vaaturi jaoks / Install system libraries for the 3D viewer
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      # Installime Node teegid (sh cloudflared) / Install Node modules (including cloudflared)
      - name: Install Node modules
        run: npm install

      # Käivitame kiire Cloudflare tunneli ja boti / Start fast Cloudflare tunnel and the bot
      - name: Run Bot and Fast Dashboard
        run: |
          npx cloudflared tunnel --url http://127.0.0.1:6767 > tunnel.log 2>&1 &
          sleep 6
          echo "=========================================="
          echo "OPEN THIS FAST DASHBOARD LINK:"
          grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1
          echo "=========================================="
          node bot.js