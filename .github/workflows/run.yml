name: Run MC Bot
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Installime süsteemi teegid 3D vaaturi jaoks / Install system libraries for the 3D viewer
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      # Installime Node teegid / Install Node modules
      - name: Install Node modules
        run: npm install

      # Käivitame tunneli, ootame lingi ilmumist ja käivitame boti / Start tunnel, wait for link, and start bot
      - name: Run Bot and Fast Dashboard
        run: |
          npx cloudflared tunnel --url http://127.0.0.1:6767 > tunnel.log 2>&1 &
          
          # Ootame kuni 30 sekundit, kuni Cloudflare link on valmis / Wait up to 30 seconds until the Cloudflare link is ready
          for i in {1..30}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done

          echo "=========================================="
          echo "OPEN THIS FAST DASHBOARD LINK:"
          if [ -n "$URL" ]; then
            echo "$URL"
          else
            echo "Link failed to generate. Tunnel log:"
            cat tunnel.log
          fi
          echo "=========================================="
          
          node bot.js